# Screenshot run right-side pager-ish config (sits left of the dock strip).
@edge right
@anchor right top
@width 192
@height 240
@pager_columns 2
@pager_rows 1
@margin top 27
@margin right 69
@nodock
Work|normal/Desktop=@workspace 1
WWW|normal/WWW=@workspace 2
Mail|normal/Mail=@workspace 3
Games|normal/Cardgames=@workspace 4
