# AfterStep Wayland default menu.
# Commands are either:
#   - compositor actions via afterstep-control (prefix with '@'), or
#   - client commands executed by the compositor (spawned with activation token when possible).

@title AfterStep

Terminal|normal/Terminal=${TERMINAL:-foot}
Run|normal/Wrench=fuzzel || bemenu-run || wofi --show drun
Browser|normal/WWW=${BROWSER:-firefox}
Files|normal/Filecabinet2=${FILE_MANAGER:-pcmanfm}
Lock screen|normal/LockClosed=aswllock

Close focused|dots/abi-close=@close
Quit compositor|dots/abi-close=@quit
